# Calls the payment reconciliation sweep every 10 minutes.
# Vercel Hobby only allows daily crons, so this does the frequent runs for free.
#
# Setup — repo Settings → Secrets and variables → Actions → New repository secret:
#   APP_URL      e.g. https://c-zuchigrp.com   (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
name: Reconcile payments

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: reconcile-payments
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call reconcile endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set"; exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$APP_URL/api/payments/reconcile" \
            -H "Authorization: Bearer $CRON_SECRET"
